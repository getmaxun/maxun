<!doctype html>
<html><head><title>Course catalog</title>
<style>
  .course { height: 260px; border: 1px solid #ccc; margin: 8px; }
  .syllabus[hidden] { display: none; }
  #cookie-banner { position: fixed; inset: 0; background: rgba(0,0,0,.6); }
</style></head><body>
<div id="cookie-banner" role="dialog" aria-modal="true"><p>We use cookies.</p><button id="accept-cookies">Accept all</button></div>
<h1>Course catalog</h1>
<div id="courses">
  <div class="course"><h3 class="course-title">Intro to Databases</h3><span class="credits">4 credits</span></div>
  <div class="course"><h3 class="course-title">Operating Systems</h3><span class="credits">3 credits</span></div>
  <div class="course"><h3 class="course-title">Computer Networks</h3><span class="credits">4 credits</span></div>
</div>
<div id="sentinel" style="height: 10px"></div>
<section class="faq">
  <h2>Program details</h2>
  <button class="toggle" aria-expanded="false" aria-controls="tuition">Show tuition</button>
  <div id="tuition" class="syllabus" hidden><p>Tuition: <span class="tuition-value">$12,400 per year</span></p></div>
  <details><summary>Application deadline</summary><p class="deadline">March 15, 2027</p></details>
</section>
<script>
  // Accordion: the tuition text is only rendered once the button is clicked.
  document.querySelector('.toggle').addEventListener('click', function () {
    this.setAttribute('aria-expanded', 'true');
    var region = document.getElementById('tuition');
    region.hidden = false;
  });
  document.getElementById('accept-cookies').addEventListener('click', function () {
    document.getElementById('cookie-banner').remove();
  });
  // Lazy loading: more courses render when the page is scrolled to the bottom.
  var more = [['Compilers', '4 credits'], ['Machine Learning', '3 credits'], ['Computer Graphics', '3 credits']];
  var loaded = false;
  window.addEventListener('scroll', function () {
    if (loaded) return;
    if (window.scrollY + window.innerHeight >= document.body.scrollHeight - 400) {
      loaded = true;
      setTimeout(function () {
        var list = document.getElementById('courses');
        more.forEach(function (c) {
          var div = document.createElement('div');
          div.className = 'course';
          div.innerHTML = '<h3 class="course-title">' + c[0] + '</h3><span class="credits">' + c[1] + '</span>';
          list.appendChild(div);
        });
      }, 50);
    }
  });
</script>
</body></html>

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      # Postgres 18+ keeps its data in /var/lib/postgresql/18/docker, so mount the parent.
      # This is a new volume: data from the old postgres:13 volume (postgres_data) must be
      # migrated with a dump and restore. See docs/self-hosting-docker.md.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio was removed from Docker Hub. Silo (pgsty/silo) is a maintained MinIO fork.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address :${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}"  # API port
      - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}"  # WebUI port
    volumes:
      - minio_data:/data

  backend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.backend
    image: getmaxun/maxun-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    env_file: .env
    environment:
      BACKEND_URL: ${BACKEND_URL}
      # Same interpolation as the browser service so both always get the same token.
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
      CI: "true"
      CONTAINER: "true"
      # DEBUG: pw:api
      # PWDEBUG: 1
      CHROMIUM_FLAGS: '--disable-gpu --no-sandbox --headless=new'
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
    - seccomp=unconfined
    shm_size: '2gb'
    mem_limit: 6g
    depends_on:
      - postgres
      - minio
    volumes:
      - /var/run/dbus:/var/run/dbus

  frontend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.frontend 
    image: getmaxun/maxun-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    env_file: .env
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      BACKEND_URL: ${BACKEND_URL}
    depends_on:
      - backend

  browser:
    # build:
    #   context: .
    #   dockerfile: browser/Dockerfile
    #   args:
    #     BROWSER_WS_PORT: ${BROWSER_WS_PORT:-3001}
    #     BROWSER_HEALTH_PORT: ${BROWSER_HEALTH_PORT:-3002}
    image: getmaxun/maxun-browser:latest
    # The backend reaches the browser over the Compose network. These ports
    # give unauthenticated control of the browser, so they are only published
    # on the host's loopback interface (for running the backend outside Docker).
    # Docker Engine versions before 28.0.0 let hosts on the same L2 network reach
    # loopback-published ports. Use Docker Engine 28.0.0 or later on shared
    # networks, or remove these mappings when the backend runs inside Compose.
    ports:
      - "127.0.0.1:${BROWSER_WS_PORT:-3001}:${BROWSER_WS_PORT:-3001}"
      - "127.0.0.1:${BROWSER_HEALTH_PORT:-3002}:${BROWSER_HEALTH_PORT:-3002}"
    environment:
      - NODE_ENV=production
      - DEBUG=pw:browser*
      - BROWSER_WS_PORT=${BROWSER_WS_PORT:-3001}
      - BROWSER_HEALTH_PORT=${BROWSER_HEALTH_PORT:-3002}
      - BROWSER_WS_HOST=${BROWSER_WS_HOST:-browser}
      - BROWSER_SERVICE_TOKEN=${BROWSER_SERVICE_TOKEN:-}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BROWSER_HEALTH_PORT:-3002}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '1.0'
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN

volumes:
  postgres18_data:
  minio_data:
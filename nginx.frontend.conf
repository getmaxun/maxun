# Used by Dockerfile.frontend. __FRONTEND_PORT__ is filled in when the container starts.
server {
    listen __FRONTEND_PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in asset file names, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: send unknown paths to index.html, like `serve -s` did.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
